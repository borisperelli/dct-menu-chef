<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCT MENU CHEF — Planning courses</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{font-family:Inter,Arial,sans-serif;margin:0;background:#f4f6f8;color:#152033}.top{background:#10233f;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.sub{opacity:.75;font-size:13px}.wrap{max-width:1100px;margin:22px auto;padding:0 16px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#1677ff;color:white}.dark{background:#10233f;color:white}.card{background:white;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 4px 18px #0000000d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #d8dee7;border-radius:9px;padding:10px}.course{border:1px solid #e0e5eb;border-radius:13px;padding:15px;margin-top:10px}.course h3{margin:0 0 5px}.muted{color:#667085}.chef{display:inline-block;background:#eef3f8;border-radius:20px;padding:6px 9px;margin:4px 4px 0 0;font-size:13px}.menu{padding:10px 0;border-top:1px solid #eee}.hidden{display:none}.notice{padding:12px;border-radius:10px;background:#fff7df;margin-top:12px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{background:white;border-radius:16px;padding:20px;max-width:650px;width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{padding:15px}.wrap{margin:12px auto}}
</style></head><body>
<header class="top"><div><div class="brand">DECATHLON CMA CGM</div><div class="sub">Planning commun des courses</div></div><div style="display:flex;gap:8px;align-items:center"><a href="index.html" class="btn" style="text-decoration:none;color:#10233f;background:white">Retour au planning</a><button id="logout" class="btn" style="display:none">Déconnexion</button></div></header>
<main class="wrap"><div id="login" class="modal"><div class="modalbox"><h2>Connexion</h2><p class="muted">Connecte-toi avec ton compte chef.</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field" style="margin-top:10px"><label>Mot de passe</label><input id="password" type="password"></div><button id="loginBtn" class="btn primary" style="margin-top:14px">Se connecter</button><div id="loginMsg" class="notice hidden"></div></div></div>
<div class="bar"><div><h1 style="margin:0">🏁 Planning des courses</h1><div id="who" class="muted"></div></div><button id="addBtn" class="btn primary hidden">＋ Ajouter une course</button></div><div id="msg" class="notice hidden"></div><section class="card"><h2 style="margin-top:0">Affectations des chefs</h2><p class="muted" style="margin-top:-6px">Chaque course affiche les chefs affectés et les menus déposés.</p><h2>Courses à venir</h2><div id="courses">Chargement…</div></section></main>
<div id="editor" class="modal hidden"><div class="modalbox"><h2 id="editorTitle">Nouvelle course</h2><div class="grid"><div class="field"><label>Nom de la course</label><input id="cname"></div><div class="field"><label>Date</label><input id="cdate" type="date"></div><div class="field"><label>Lieu</label><input id="clieu"></div><div class="field"><label>Description</label><input id="cdesc"></div></div><div style="margin-top:15px;display:flex;gap:8px;justify-content:flex-end"><button id="cancel" class="btn">Annuler</button><button id="saveCourse" class="btn primary">Enregistrer</button></div></div></div>
<script>
const URL='https://dlkyvuthefrhmvbsoihs.supabase.co';const KEY='sb_publishable_EhVcfTA5GvSgIYkGS4iK9g_qb70bBHC';const sb=window.supabase.createClient(URL,KEY);let me=null,editing=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showMsg(t){$('msg').textContent=t;$('msg').classList.remove('hidden')}
async function init(){const {data:{session}}=await sb.auth.getSession();if(session) await enter(session);}
async function enter(session){$('login').classList.add('hidden');$('logout').style.display='block';const {data:chef}=await sb.from('chefs').select('id,nom,role').eq('auth_user_id',session.user.id).single();me=chef;if(!me){showMsg('Compte chef non relié dans la base.');return} $('who').textContent=`Connecté : ${me.nom}${me.role==='admin'?' · Référent':''}`;if(me.role==='admin')$('addBtn').classList.remove('hidden');await load();}
async function load(){const {data:cs,error}=await sb.from('courses').select('id,nom,date_course,lieu,description,course_chefs(id,chef_id,chefs(id,nom)),menus(id,nom_menu,date_menu,fichier_nom,chef_id,course_id,chefs(nom))').eq('actif',true).order('date_course',{ascending:true});if(error){showMsg(error.message);return}if(!cs?.length){$('courses').innerHTML='<p class="muted">Aucune course programmée.</p>';return}$('courses').innerHTML=cs.map(c=>`<article class="course"><h3>${esc(c.nom)}</h3><div class="muted">${esc(c.date_course||'Date non renseignée')} · ${esc(c.lieu||'Lieu non renseigné')}</div>${c.description?`<p>${esc(c.description)}</p>`:''}<div><b>Chefs :</b> ${c.course_chefs?.length?c.course_chefs.map(x=>`<span class="chef">${esc(x.chefs?.nom||'Chef')}</span>`).join(''):'<span class="muted">Aucun chef affecté</span>'}</div><div style="margin-top:12px"><b>Menus déposés :</b>${c.menus?.length?c.menus.map(m=>`<div class="menu">${esc(m.nom_menu||m.fichier_nom||'Menu')} — ${esc(m.chefs?.nom||'Chef')}</div>`).join(''):'<div class="muted" style="margin-top:6px">Aucun menu lié à cette course pour le moment.</div>'}</div>${me.role==='admin'?`<div style="margin-top:12px"><button class="btn" onclick="editCourse('${c.id}')">Modifier</button> <button class="btn" onclick="assign('${c.id}')">Affecter des chefs</button> <button class="btn" onclick="delCourse('${c.id}')">Supprimer</button></div>`:''}</article>`).join('')}
async function editCourse(id){const {data:c}=await sb.from('courses').select('*').eq('id',id).single();editing=id;$('editorTitle').textContent='Modifier la course';$('cname').value=c.nom||'';$('cdate').value=c.date_course||'';$('clieu').value=c.lieu||'';$('cdesc').value=c.description||'';$('editor').classList.remove('hidden')}
function newCourse(){editing=null;$('editorTitle').textContent='Nouvelle course';['cname','cdate','clieu','cdesc'].forEach(id=>$(id).value='');$('editor').classList.remove('hidden')}
async function saveCourse(){const row={nom:$('cname').value.trim(),date_course:$('cdate').value||null,lieu:$('clieu').value.trim(),description:$('cdesc').value.trim(),actif:true};let q=editing?sb.from('courses').update(row).eq('id',editing):sb.from('courses').insert(row);const {error}=await q;if(error){showMsg(error.message);return}$('editor').classList.add('hidden');await load()}
async function delCourse(id){if(!confirm('Supprimer cette course ?'))return;const {error}=await sb.from('courses').update({actif:false}).eq('id',id);if(error)showMsg(error.message);else load()}
async function assign(id){const names=prompt('Entre les noms des chefs à affecter, séparés par des virgules.');if(names===null)return;const wanted=names.split(',').map(x=>x.trim()).filter(Boolean);const {data:chefs,error}=await sb.from('chefs').select('id,nom').eq('actif',true);if(error){showMsg(error.message);return}await sb.from('course_chefs').delete().eq('course_id',id);const rows=chefs.filter(c=>wanted.some(w=>w.toLowerCase()===c.nom.toLowerCase())).map(c=>({course_id:id,chef_id:c.id}));if(rows.length){const {error:e}=await sb.from('course_chefs').insert(rows);if(e){showMsg(e.message);return}}await load()}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').textContent=error.message;$('loginMsg').classList.remove('hidden')}else init()};$('logout').onclick=()=>sb.auth.signOut().then(()=>location.reload());$('addBtn').onclick=newCourse;$('cancel').onclick=()=>$('editor').classList.add('hidden');$('saveCourse').onclick=saveCourse;init();
</script></body></html>
